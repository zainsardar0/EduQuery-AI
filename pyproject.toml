[project]
name = "eduquery-api"
version = "0.1.0"
description = "EduQuery AI Backend API Service"
readme = "services/api/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose>=3.3.0",
    "sqlglot>=23.0.0",
    "httpx>=0.27.0",
    "pyodbc>=5.3.0",
    "wrenai[mssql]>=0.13.0,<0.14.0",
    "lancedb>=0.37.1,<0.38.0",
    "fastembed>=0.8.0,<0.9.0",
    "onnxruntime>=1.23.0,<2.0.0",
    "google-genai>=2.22.0",
    "python-multipart>=0.0.32",
    "pymssql>=2.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services.api*", "services.query*", "packages.contracts*"]
namespaces = true

[tool.setuptools.package-data]
"services.query" = ["wren_project/target/*.json"]
